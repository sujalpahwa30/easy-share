<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Send with EasyShare</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("easyshare-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = savedTheme || (prefersDark ? "dark" : "light");
      } catch (_error) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell sender">
      <section class="send-card">
        <div class="send-head">
          <div class="brand-block compact">
            <div class="brand-mark" aria-hidden="true">
              <span></span>
            </div>
            <div>
              <p class="eyebrow">EasyShare</p>
              <h1>Room <span id="roomCode"></span></h1>
              <div class="trust-row compact" aria-label="Transfer qualities">
                <span class="trust-pill">No sign-in</span>
                <span class="trust-pill">Chunked transfer</span>
              </div>
            </div>
          </div>
          <div class="send-actions">
            <button class="icon-button secondary" type="button" data-theme-toggle title="Switch theme" aria-label="Switch theme">
              <span class="theme-glyph" aria-hidden="true"></span>
            </button>
            <span id="mode" class="status">Joining room</span>
          </div>
        </div>

        <form id="uploadForm">
          <label id="dropzone" class="dropzone" for="file">
            <input id="file" name="file" type="file" multiple required />
            <span class="drop-icon" aria-hidden="true"></span>
            <strong id="fileText">Drop files here</strong>
            <small>Presentations, PDFs, images, videos, and documents</small>
          </label>

          <div id="queue" class="file-queue empty">
            <p>No files selected.</p>
          </div>

          <div class="transfer-meter">
            <div class="beam" aria-hidden="true">
              <span></span>
            </div>
            <progress id="progress" value="0" max="100"></progress>
          </div>

          <div class="form-actions">
            <button id="sendButton" type="submit">Send files</button>
            <button id="clearButton" class="quiet-button" type="button">Clear</button>
          </div>
        </form>
        <div id="result" class="result" role="status"></div>
      </section>
    </main>
    <script src="/theme.js"></script>
    <script src="/sender.js"></script>
  </body>
</html>
